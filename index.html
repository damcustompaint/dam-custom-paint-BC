<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAM CUSTOM PAINT - Atelier Pro v9.0</title>
    
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --dark-bg: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        #app-container {
            max-width: 650px; width: 100%;
            background: var(--card-bg);
            border: 2px solid #333; border-radius: 20px;
            padding: 30px; box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .header-pro {
            border: 3px solid var(--neon-blue);
            padding: 20px; text-align: center; margin-bottom: 30px; border-radius: 15px;
        }

        .logo-text { font-size: 26px; font-weight: 900; color: var(--neon-pink); text-transform: uppercase; text-shadow: 2px 2px 0 #000; }

        .section-card { background: #222; border-radius: 12px; margin-bottom: 20px; border-left: 8px solid #333; overflow: hidden; }
        .card-pink { border-left-color: var(--neon-pink); }
        .card-blue { border-left-color: var(--neon-blue); }

        h2 { font-size: 1em; text-transform: uppercase; padding: 12px 15px; margin: 0; background: rgba(0,0,0,0.2); }
        
        input, textarea, select {
            width: 100%; background: #111; border: 2px solid #333;
            color: #fff; padding: 12px; border-radius: 8px; box-sizing: border-box;
            margin-bottom: 12px; font-size: 14px;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .photo-btn {
            background: #111; border: 1px dashed var(--neon-blue);
            color: var(--neon-blue); padding: 10px; border-radius: 8px;
            text-align: center; cursor: pointer; display: block; margin-bottom: 10px;
        }

        .gallery { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .gallery img { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; border: 1px solid var(--neon-blue); }

        .sig-wrapper { background: #fff; border-radius: 10px; margin-top: 10px; }
        canvas { width: 100%; height: 150px; cursor: crosshair; touch-action: none; }

        .btn-submit {
            width: 100%; padding: 20px; background: #000; color: var(--neon-blue); 
            border: 3px solid var(--neon-blue); border-radius: 12px; font-weight: 900; 
            font-size: 1.2em; cursor: pointer; text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-submit:hover { background: var(--neon-blue); color: #000; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app-container">
    <div class="header-pro">
        <div class="logo-text">DAM CUSTOM PAINT</div>
        <div style="font-size: 0.8em; color: var(--neon-blue); font-weight: bold; margin-top: 5px;">SIRET : 839 100 898 00015</div>
    </div>

    <form id="orderForm">
        <div class="section-card card-pink">
            <h2><i class="fa-solid fa-user"></i> Client</h2>
            <div style="padding: 15px;">
                <input type="text" id="nom" placeholder="NOM DU CLIENT">
                <input type="text" id="mail" placeholder="MAIL DU CLIENT">
                <input type="tel" id="tel" placeholder="TÉLÉPHONE">
            </div>
        </div>

        <div class="section-card card-pink">
            <h2><i class="fa-solid fa-motorcycle"></i> Moto</h2>
            <div style="padding: 15px;">
                <select id="marque">
                    <option value="">-- MARQUE --</option>
                    <option value="Yamaha">Yamaha</option>
                    <option value="Honda">Honda</option>
                    <option value="Kawasaki">Kawasaki</option>
                    <option value="BMW">BMW</option>
                    <option value="Harley">Harley-Davidson</option>
                    <option value="Suzuki">Suzuki</option>
                    <option value="Autre">Autre</option>
                </select>
                <select id="moto_modele">
                    <option value="">-- MODÈLE --</option>
                </select>
                <input type="text" id="immat" placeholder="IMMATRICULATION">
            </div>
        </div>

        <div class="section-card card-blue">
            <h2><i class="fa-solid fa-camera"></i> Photos (Max 3)</h2>
            <div style="padding: 15px;">
                <label class="photo-btn" for="inpEtat">ÉTAT INITIAL</label>
                <input type="file" id="inpEtat" class="hidden" multiple accept="image/*">
                <div id="gal-etat" class="gallery"></div>

                <label class="photo-btn" for="inpInsp" style="border-color: var(--neon-pink); color: var(--neon-pink);">INSPIRATION</label>
                <input type="file" id="inpInsp" class="hidden" multiple accept="image/*">
                <div id="gal-insp" class="gallery"></div>
            </div>
        </div>

        <div class="section-card card-blue">
            <h2><i class="fa-solid fa-euro-sign"></i> Règlement & Dépôt</h2>
            <div style="padding: 15px;">
                <div class="grid-2">
                    <input type="number" id="prix" placeholder="PRIX TOTAL €">
                    <select id="mode_reglement">
                        <option value="Espèces">Espèces</option>
                        <option value="Virement">Virement</option>
                        <option value="CB">CB</option>
                    </select>
                </div>
                <div class="grid-2">
                    <input type="number" id="acompte" placeholder="ACOMPTE €">
                    <input type="date" id="date_acompte">
                </div>
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 12px; color: var(--neon-blue);">DATE DE DÉPÔT DU PROJET PRÉVU :</label>
                    <input type="date" id="date_depot">
                </div>

                <div class="sig-wrapper">
                    <canvas id="sig"></canvas>
                </div>
                <button type="button" onclick="signaturePad.clear()" style="background:none; border:none; color:var(--neon-pink); cursor:pointer; width:100%; text-align:right; padding:10px; font-weight: bold;">[ EFFACER LA SIGNATURE ]</button>
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="generatePDF()">GÉNÉRER ET ENVOYER LE PDF</button>
    </form>
</div>

<script>
    const canvas = document.getElementById('sig');
    const signaturePad = new SignaturePad(canvas, { penColor: "rgb(0, 0, 0)" });

    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
        signaturePad.clear();
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const baseMotos = {
        "Yamaha": ["MT-07", "MT-09", "MT-10", "R1", "T-MAX", "R7", "R9", "XSR125", "XSR900"],
        "Honda": ["CB500", "Africa Twin", "X-ADV"],
        "Kawasaki": ["Z900", "Z650", "ZX10R", "ZX6R", "Eliminator 500", "Z1100", "Z1000"],
        "BMW": ["R1250 GS", "S1000RR", "NineT"],
        "Harley": ["Sportster", "Softail", "Fat Boy", "Street Glide"],
        "Suzuki": ["SV650", "GSXR", "Hayabusa"]
    };

    document.getElementById('marque').addEventListener('change', function() {
        const m = document.getElementById('moto_modele');
        m.innerHTML = '<option value="">-- MODÈLE --</option>';
        if(baseMotos[this.value]) {
            baseMotos[this.value].forEach(mod => {
                let o = document.createElement('option'); o.value = mod; o.text = mod;
                m.appendChild(o);
            });
        }
    });

    const imgEtat = []; const imgInsp = [];
    function handleFiles(inputId, galId, storage) {
        document.getElementById(inputId).addEventListener('change', function(e) {
            const gal = document.getElementById(galId);
            gal.innerHTML = ""; storage.length = 0;
            Array.from(e.target.files).slice(0, 3).forEach(file => {
                const r = new FileReader();
                r.onload = (ev) => {
                    storage.push(ev.target.result);
                    const i = document.createElement('img'); i.src = ev.target.result;
                    gal.appendChild(i);
                };
                r.readAsDataURL(file);
            });
        });
    }
    handleFiles('inpEtat', 'gal-etat', imgEtat);
    handleFiles('inpInsp', 'gal-insp', imgInsp);

    async function generatePDF() {
        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // HEADER
            doc.setFont("helvetica", "bold");
            doc.setFontSize(22);
            doc.setTextColor(233, 30, 99);
            doc.text("DAM CUSTOM PAINT", 105, 20, { align: 'center' });
            
            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text("SIRET : 839 100 898 00015 | Annequin (62)", 105, 28, { align: 'center' });
            doc.text("TVA non applicable, art. 293 B du CGI", 105, 33, { align: 'center' });

            // INFOS CLIENT
            const nomC = document.getElementById('nom').value || 'CLIENT';
            doc.setFontSize(12);
            doc.setTextColor(0);
            doc.text(`CLIENT : ${nomC}`, 15, 50);
            doc.setFont("helvetica", "normal");
            doc.text(`Email : ${document.getElementById('mail').value || '-'}`, 15, 57);
            doc.text(`Tél : ${document.getElementById('tel').value || '-'}`, 15, 64);

            // INFOS VÉHICULE
            const marque = document.getElementById('marque').value;
            const modele = document.getElementById('moto_modele').value;
            doc.setFont("helvetica", "bold");
            doc.text("VÉHICULE :", 15, 78);
            doc.setFont("helvetica", "normal");
            doc.text(`${marque} ${modele} [${document.getElementById('immat').value || 'SANS IMMAT'}]`, 50, 78);
            doc.text(`Date de dépôt prévue : ${document.getElementById('date_depot').value || 'À définir'}`, 15, 85);

            doc.setDrawColor(200);
            doc.line(15, 92, 195, 92);

            // RÈGLEMENT
            const prix = parseFloat(document.getElementById('prix').value) || 0;
            const acompte = parseFloat(document.getElementById('acompte').value) || 0;
            const mode = document.getElementById('mode_reglement').value;
            const dateAcompte = document.getElementById('date_acompte').value || '-';

            doc.setFont("helvetica", "bold");
            doc.text("DÉTAILS DU RÈGLEMENT :", 15, 102);
            doc.setFont("helvetica", "normal");
            doc.text(`PRIX TOTAL : ${prix} EUR`, 15, 110);
            doc.text(`ACOMPTE VERSÉ : ${acompte} EUR (le ${dateAcompte})`, 15, 117);
            doc.text(`MODE DE RÈGLEMENT : ${mode}`, 15, 124); 
            
            doc.setFont("helvetica", "bold");
            doc.setTextColor(233, 30, 99);
            doc.text(`RESTE À RÉGLER (SOLDE) : ${prix - acompte} EUR`, 15, 134);
            doc.setTextColor(0);

            // PHOTOS
            doc.setFontSize(10);
            doc.text("PHOTOS ÉTAT INITIAL :", 15, 148);
            let xOff = 15;
            imgEtat.forEach(img => { 
                try { doc.addImage(img, 'JPEG', xOff, 150, 30, 30); xOff += 35; } catch(e){} 
            });
            
            doc.text("PHOTOS INSPIRATION :", 15, 188);
            xOff = 15;
            imgInsp.forEach(img => { 
                try { doc.addImage(img, 'JPEG', xOff, 190, 30, 30); xOff += 35; } catch(e){} 
            });

            // SIGNATURE
            if (!signaturePad.isEmpty()) {
                doc.setFont("helvetica", "bold");
                doc.text("SIGNATURE CLIENT :", 140, 235);
                const sigData = signaturePad.toDataURL();
                doc.addImage(sigData, 'PNG', 140, 240, 45, 25);
            }

            doc.setFontSize(8);
            doc.setTextColor(150);
            doc.text("Document généré numériquement par DAM CUSTOM PAINT", 105, 285, { align: 'center' });

            // ENVOI / PARTAGE (C'est ici que la magie opère)
            const pdfBlob = doc.output('blob');
            const fileName = `BON_DAM_${nomC.replace(/\s+/g, '_')}.pdf`;

            if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([pdfBlob], fileName, { type: 'application/pdf' })] })) {
                const file = new File([pdfBlob], fileName, { type: 'application/pdf' });
                await navigator.share({
                    files: [file],
                    title: 'Bon de commande DAM CUSTOM PAINT',
                    text: `Bonjour ${nomC}, voici votre bon de commande pour votre ${marque} ${modele}.`
                });
            } else {
                // Si pas de partage natif (vieux navigateur), on télécharge simplement
                doc.save(fileName);
            }

        } catch (err) {
            alert("Erreur : " + err.message);
        }
    }
</script>

</body>
</html>
